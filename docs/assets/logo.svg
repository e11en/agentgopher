<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-label="agentgopher">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#5DC9E2"/>
    </linearGradient>
  </defs>
  <!-- sandbox: an isometric box with the lid open -->
  <g transform="translate(14,14)">
    <polygon points="46,0 92,23 46,46 0,23" fill="url(#box)" opacity="0.35"/>
    <polygon points="0,23 46,46 46,92 0,69" fill="#00ADD8"/>
    <polygon points="46,46 92,23 92,69 46,92" fill="#007D9C"/>
    <polygon points="0,23 46,0 92,23 46,46" fill="none" stroke="#005F7A" stroke-width="2"/>
    <!-- gopher peeking out: head, eyes, nose -->
    <ellipse cx="46" cy="30" rx="20" ry="17" fill="#F2E2A4" stroke="#005F7A" stroke-width="2"/>
    <circle cx="38" cy="27" r="5" fill="#fff" stroke="#005F7A" stroke-width="1.5"/>
    <circle cx="54" cy="27" r="5" fill="#fff" stroke="#005F7A" stroke-width="1.5"/>
    <circle cx="39.5" cy="27.5" r="2" fill="#111"/>
    <circle cx="55.5" cy="27.5" r="2" fill="#111"/>
    <ellipse cx="46" cy="36" rx="4" ry="2.6" fill="#3B2B1B"/>
    <rect x="43" y="39" width="6" height="4" rx="1" fill="#fff" stroke="#005F7A" stroke-width="1"/>
    <ellipse cx="27" cy="20" rx="5" ry="6" fill="#F2E2A4" stroke="#005F7A" stroke-width="1.5"/>
    <ellipse cx="65" cy="20" rx="5" ry="6" fill="#F2E2A4" stroke="#005F7A" stroke-width="1.5"/>
  </g>
  <text x="128" y="62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1F2933">agent<tspan fill="#00ADD8">gopher</tspan></text>
  <text x="130" y="90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#52606D">sandboxed AI coding agents, orchestrated from Go</text>
</svg>
